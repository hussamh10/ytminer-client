[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytminer-client"
version = "0.3.1"
description = "Distributed YouTube video downloader client (+ transcript mode)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27.0",
    "yt-dlp>=2025.0",
    "imageio-ffmpeg>=0.4.9",
    # for --political-videos (transcript mode): supplies the yt-dlp PO-token plugin.
    # A bgutil PO-token provider server must also be running (see --provider-url).
    "bgutil-ytdlp-pot-provider>=1.3.0",
]

[project.scripts]
ytminer-download = "ytminer_client.cli:main"

[tool.setuptools.packages.find]
include = ["ytminer_client*"]
